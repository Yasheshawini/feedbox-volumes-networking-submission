services:
  db:
    image: postgres:15
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - database_network

  api:
    build: .
    ports:
      - "5000:5000"
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - web_network
      - database_network

  web:
    build: ./client
    ports:
      - "3000:80"
    depends_on:
      - api
    networks:
      - web_network

volumes:
  postgres_data:

networks:
  web_network:
    driver: bridge
  database_network:
    driver: bridge